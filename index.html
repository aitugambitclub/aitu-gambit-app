<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AITU Gambit</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- JQuery & Chessboard.js CSS/JS -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <!-- Chess.js (Правила шахмат) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .header h2 {
            margin: 0;
            color: #38bdf8;
            font-size: 24px;
        }

        .status {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 5px;
        }

        #myBoard {
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>♟ AITU Gambit</h2>
        <div class="status" id="status">Ход белых</div>
    </div>

    <!-- Шахматная доска -->
    <div id="myBoard"></div>

    <div class="controls">
        <button class="btn" id="startBtn">Новая игра</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачивает окно на весь экран

        let board = null;
        let game = new Chess();
        let $status = $('#status');

        function onDragStart (source, piece, position, orientation) {
            // Запретить двигать фигуры, если игра окончена
            if (game.game_over()) return false;

            # Запретить ходить фигурами соперника
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        function onDrop (source, target) {
            // Проверка легальности хода через chess.js
            let move = game.move({
                from: source,
                to: target,
                promotion: 'q' // Автоматическое превращение пешки в ферзя
            });

            // Нелегальный ход
            if (move === null) return 'snapback';

            updateStatus();
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        function updateStatus () {
            let status = '';
            let moveColor = game.turn() === 'w' ? 'Белых' : 'Черных';

            if (game.in_checkmate()) {
                status = 'Мат! Игра окончена. Победили ' + (game.turn() === 'w' ? 'Черные' : 'Белые');
            } else if (game.in_draw()) {
                status = 'Ничья!';
            } else {
                status = 'Ход ' + moveColor;
                if (game.in_check()) {
                    status += ', Шах!';
                }
            }

            $status.html(status);
        }

        let config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };

        board = Chessboard('myBoard', config);
        updateStatus();

        $('#startBtn').on('click', function() {
            game.reset();
            board.start();
            updateStatus();
        });
    </script>
</body>
</html>
