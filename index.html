<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AITU Gambit</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- jQuery & Chessboard.js CSS/JS -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <!-- Chess.js (Правила шахмат) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        :root {
            --bg-dark: #262421;
            --card-bg: #312e2b;
            --text-main: #ffffff;
            --text-secondary: #989795;
            --board-light: #eeeed2;
            --board-dark: #769656;
            --accent-green: #81b64c;
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation; /* Убирает задержку и фантомные клики */
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            margin-bottom: 4px;
        }

        .app-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }

        .mode-select {
            background: #403d39;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
        }

        .player-card {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 6px;
            margin: 4px 0;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 4px;
            background: #403d39;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 15px;
            color: var(--accent-green);
        }

        .player-details {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            font-size: 14px;
            font-weight: 600;
        }

        .player-rating {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .timer {
            background: #21201d;
            padding: 5px 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
        }

        .timer.active {
            background: #ffffff;
            color: #000000;
        }

        #myBoard {
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            position: relative;
        }

        .square-55d63 {
            position: relative;
            cursor: pointer;
        }

        .white-1e1d7 {
            background-color: var(--board-light) !important;
        }

        .black-3c85d {
            background-color: var(--board-dark) !important;
        }

        .piece-417db {
            z-index: 2 !important;
            max-width: 86% !important;
            max-height: 86% !important;
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            pointer-events: none !important; /* Убирает перехват событий клика картинкой */
        }

        img {
            -webkit-user-drag: none;
            user-drag: none;
        }

        .notation-322f9 {
            font-size: 10px !important;
            font-weight: 700 !important;
            pointer-events: none !important;
            z-index: 10 !important;
            position: absolute !important;
            line-height: 1 !important;
        }

        .numeric-fc326 {
            top: 2px !important;
            left: 2px !important;
        }

        .alpha-d2270 {
            bottom: 2px !important;
            right: 2px !important;
        }

        .white-1e1d7 .notation-322f9 {
            color: var(--board-dark) !important;
        }

        .black-3c85d .notation-322f9 {
            color: var(--board-light) !important;
        }

        .highlight-selected {
            background-color: #bbcb2b !important;
        }

        .highlight-hint::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24%;
            height: 24%;
            background-color: rgba(0, 0, 0, 0.22);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }

        .highlight-capture::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 4px solid rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }

        .game-status {
            margin: 8px 0;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            text-align: center;
        }

        .controls {
            width: 100%;
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .btn {
            flex: 1;
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #588231;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #588231;
        }

        .btn-secondary {
            background-color: #363431;
            box-shadow: 0 4px 0 #21201e;
        }

        .btn-secondary:active {
            box-shadow: 0 2px 0 #21201e;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="app-header">
            <div class="app-title">♟ AITU Gambit</div>
            <select id="gameMode" class="mode-select">
                <option value="bot">Режим: Бот</option>
                <option value="self">Режим: 2 Игрока</option>
            </select>
        </div>

        <div class="player-card">
            <div class="player-info">
                <div class="avatar" id="opponentAvatar">🤖</div>
                <div class="player-details">
                    <span class="player-name" id="opponentName">Бот (Stockfish Lite)</span>
                    <span class="player-rating">1200 ELO</span>
                </div>
            </div>
            <div class="timer" id="blackTimer">10:00</div>
        </div>

        <div id="myBoard"></div>

        <div class="player-card">
            <div class="player-info">
                <div class="avatar" id="myAvatar">W</div>
                <div class="player-details">
                    <span class="player-name" id="myName">Вы</span>
                    <span class="player-rating">1200 ELO</span>
                </div>
            </div>
            <div class="timer active" id="whiteTimer">10:00</div>
        </div>

        <div class="game-status" id="status">Ход белых</div>

        <div class="controls">
            <button class="btn btn-secondary" id="flipBtn">🔄 Перевернуть</button>
            <button class="btn" id="startBtn">Новая игра</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('myName').innerText = user.first_name;
            document.getElementById('myAvatar').innerText = user.first_name.charAt(0).toUpperCase();
        }

        let board = null;
        let game = new Chess();
        let selectedSquare = null;
        let isThinking = false; // Флаг работы бота
        let $status = $('#status');

        let whiteTime = 600;
        let blackTime = 600;
        let timerInterval = null;
        let gameStarted = false;

        function formatTime(seconds) {
            let min = Math.floor(seconds / 60);
            let sec = seconds % 60;
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (game.game_over()) {
                    clearInterval(timerInterval);
                    return;
                }

                if (game.turn() === 'w') {
                    whiteTime--;
                    $('#whiteTimer').text(formatTime(whiteTime));
                    if (whiteTime <= 0) {
                        clearInterval(timerInterval);
                        $status.html('Время вышло! Победили Черные');
                    }
                } else {
                    blackTime--;
                    $('#blackTimer').text(formatTime(blackTime));
                    if (blackTime <= 0) {
                        clearInterval(timerInterval);
                        $status.html('Время вышло! Победили Белые');
                    }
                }
            }, 1000);
        }

        function resetTimers() {
            clearInterval(timerInterval);
            timerInterval = null;
            gameStarted = false;
            whiteTime = 600;
            blackTime = 600;
            $('#whiteTimer').text('10:00');
            $('#blackTimer').text('10:00');
        }

        function removeHighlights() {
            $('#myBoard .square-55d63').removeClass('highlight-selected highlight-hint highlight-capture');
        }

        function showPossibleMoves(square) {
            removeHighlights();
            $('#myBoard .square-' + square).addClass('highlight-selected');

            let moves = game.moves({ square: square, verbose: true });
            if (moves.length === 0) return;

            for (let i = 0; i < moves.length; i++) {
                let targetSquare = moves[i].to;
                if (moves[i].captured) {
                    $('#myBoard .square-' + targetSquare).addClass('highlight-capture');
                } else {
                    $('#myBoard .square-' + targetSquare).addClass('highlight-hint');
                }
            }
        }

        function handleSquareClick(square) {
            if (game.game_over() || isThinking) return;
            
            let isBotMode = $('#gameMode').val() === 'bot';
            if (isBotMode && game.turn() === 'b') return;

            if (selectedSquare === null) {
                let piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    showPossibleMoves(square);
                }
                return;
            }

            if (selectedSquare === square) {
                selectedSquare = null;
                removeHighlights();
                return;
            }

            let pieceAtTarget = game.get(square);
            if (pieceAtTarget && pieceAtTarget.color === game.turn()) {
                selectedSquare = square;
                showPossibleMoves(square);
                return;
            }

            let move = game.move({
                from: selectedSquare,
                to: square,
                promotion: 'q'
            });

            if (move !== null) {
                if (!gameStarted) {
                    gameStarted = true;
                    startTimer();
                }
                board.position(game.fen());
                selectedSquare = null;
                removeHighlights();
                updateStatus();

                if (isBotMode && !game.game_over()) {
                    isThinking = true;
                    // Асинхронный вызов бота, чтобы не блокировать интерфейс
                    setTimeout(() => {
                        makeBotMove();
                        isThinking = false;
                    }, 150);
                }
            }
        }

        const pieceValues = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };

        function evaluateBoard(boardState) {
            let totalEvaluation = 0;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    let piece = boardState[r][c];
                    if (piece) {
                        let val = pieceValues[piece.type];
                        totalEvaluation += piece.color === 'w' ? val : -val;
                    }
                }
            }
            return totalEvaluation;
        }

        function minimax(gameObj, depth, alpha, beta, isMaximizing) {
            if (depth === 0 || gameObj.game_over()) {
                return evaluateBoard(gameObj.board());
            }

            let moves = gameObj.moves();
            if (isMaximizing) {
                let maxEval = -9999;
                for (let i = 0; i < moves.length; i++) {
                    gameObj.move(moves[i]);
                    let evaluation = minimax(gameObj, depth - 1, alpha, beta, false);
                    gameObj.undo();
                    maxEval = Math.max(maxEval, evaluation);
                    alpha = Math.max(alpha, evaluation);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = 9999;
                for (let i = 0; i < moves.length; i++) {
                    gameObj.move(moves[i]);
                    let evaluation = minimax(gameObj, depth - 1, alpha, beta, true);
                    gameObj.undo();
                    minEval = Math.min(minEval, evaluation);
                    beta = Math.min(beta, evaluation);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function makeBotMove() {
            let moves = game.moves();
            if (moves.length === 0) return;

            let bestMove = null;
            let bestValue = 9999;

            for (let i = 0; i < moves.length; i++) {
                game.move(moves[i]);
                let boardValue = minimax(game, 2, -10000, 10000, true);
                game.undo();
                if (boardValue < bestValue) {
                    bestValue = boardValue;
                    bestMove = moves[i];
                }
            }

            if (bestMove) {
                game.move(bestMove);
                board.position(game.fen());
                updateStatus();
            }
        }

        function updateStatus () {
            let status = '';
            let moveColor = game.turn() === 'w' ? 'Белых' : 'Черных';

            if (game.turn() === 'w') {
                $('#whiteTimer').addClass('active');
                $('#blackTimer').removeClass('active');
            } else {
                $('#blackTimer').addClass('active');
                $('#whiteTimer').removeClass('active');
            }

            if (game.in_checkmate()) {
                status = 'Мат! Победили ' + (game.turn() === 'w' ? 'Черные' : 'Белые');
                clearInterval(timerInterval);
            } else if (game.in_draw()) {
                status = 'Ничья!';
                clearInterval(timerInterval);
            } else {
                status = 'Ход ' + moveColor;
                if (game.in_check()) {
                    status += ' (Шах!)';
                }
            }

            $status.html(status);
        }

        let config = {
            draggable: false,
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };

        board = Chessboard('myBoard', config);
        updateStatus();

        // Обработка клика без лагов
        $('#myBoard').on('pointerdown', '.square-55d63', function (e) {
            e.preventDefault();
            let square = $(this).attr('data-square');
            handleSquareClick(square);
        });

        $('#gameMode').on('change', function() {
            let mode = $(this).val();
            if (mode === 'bot') {
                $('#opponentName').text('Бот (Stockfish Lite)');
                $('#opponentAvatar').text('🤖');
            } else {
                $('#opponentName').text('Соперник');
                $('#opponentAvatar').text('B');
            }
            $('#startBtn').click();
        });

        $('#startBtn').on('click', function() {
            game.reset();
            board.start();
            selectedSquare = null;
            isThinking = false;
            resetTimers();
            removeHighlights();
            updateStatus();
        });

        $('#flipBtn').on('click', function() {
            board.flip();
            removeHighlights();
            selectedSquare = null;
        });
    </script>
</body>
</html>
